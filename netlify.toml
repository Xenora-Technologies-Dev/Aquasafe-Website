# ---------------------------------------------------------------------------
# Netlify configuration (root level)
# ---------------------------------------------------------------------------

[build]
  # Install dependencies from the backend package.json before deploying
  command   = "cd Aquasafe_Backend && npm install"
  publish   = "."          # serve static files from the repo root

[functions]
  # Serverless functions are in the backend subdirectory
  directory = "Aquasafe_Backend/netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Security & Performance Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Enforce HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy (restrict unnecessary browser features)
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://api.netlify.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self';"
    # HTTP/3 (QUIC) advertisement — helps clients upgrade to HTTP/3 automatically
    alt-svc = "h3=\":443\"; ma=86400"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------------------------
# Compression
# ---------------------------------------------------------------------------
# Netlify enables Brotli automatically for all static files.
# The Accept-Encoding: br header is set by Netlify's CDN edge nodes.
# No additional plugin configuration is required for Brotli on Netlify.
