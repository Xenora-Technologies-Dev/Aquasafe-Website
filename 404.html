<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Aquasafe Trading">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Page Not Found | Aquasafe Trading</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/Logos/Aquasafe_Short_Logo.png">
    <link rel="apple-touch-icon" href="assets/images/Logos/Aquasafe_Short_Logo.png">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #0a3d4c;
            --accent-orange: #2aa8a4;
            --accent-orange-dark: #1d8a86;
            --white: #ffffff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a3d4c 0%, #156a78 50%, #2aa8a4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            overflow: hidden;
        }
        
        .error-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        
        .error-code {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-orange), #7fcfb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        
        .error-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .error-description {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
            line-height: 1.7;
        }
        
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-orange-dark));
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(42, 168, 164, 0.4);
        }
        
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(42, 168, 164, 0.5);
            color: var(--white);
        }
        
        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 35px;
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-contact:hover {
            background: var(--white);
            color: var(--primary-dark);
            transform: translateY(-3px);
        }
        
        .error-icon {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }
        
        /* Decorative bubbles */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 6s ease-in-out infinite;
        }
        
        .bubble:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 10%; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 60px; height: 60px; bottom: 15%; left: 20%; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 100px; height: 100px; top: 30%; right: 25%; animation-delay: 1s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
    
    <!-- Aqua Bot Chatbot -->
    <link rel="stylesheet" href="assets/chatbot/chatbot.css">
</head>
<body>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-water"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
            The page you're looking for seems to have flowed away. 
            It may have been moved, removed, or the URL might be incorrect.
        </p>
        <div class="error-actions">
            <a href="index.html" class="btn-home">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="contact.html" class="btn-contact">
                <i class="fas fa-envelope"></i> Contact Us
            </a>
        </div>
    </div>
    
    <!-- Aqua Bot Chatbot -->
    <script src="assets/chatbot/chatbot.js" defer></script>
</body>
</html>
